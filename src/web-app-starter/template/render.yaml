# Render Blueprint. When creating it, set Blueprint Path to src/web-app-starter/template/render.yaml.
# Docker paths are relative to rootDir.
services:
  - type: web
    name: web-app-template
    runtime: docker
    plan: free
    region: singapore
    rootDir: src/web-app-starter/template
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Entered once in the Dashboard at Blueprint creation; never committed.
      - key: DB_HOST
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # To enable images, also add SUPABASE_URL and SUPABASE_SECRET_KEY in the Dashboard.
      - key: APP_IMAGES_ENABLED
        value: "false"

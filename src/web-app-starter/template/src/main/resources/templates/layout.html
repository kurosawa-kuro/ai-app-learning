<!doctype html>
<!--/* Shared shell. Pages call page(title, nav, heading, actions, content); nav marks the current menu item. */-->
<html lang="ja" data-theme="dark" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, nav, heading, actions, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">投稿ノート</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/admin-pico/images/favicons/sample-app.svg}">
  <link rel="stylesheet" th:href="@{/vendor/pico/pico.min.css}">
  <link rel="stylesheet" th:href="@{/admin-pico/css/admin-theme.css}">
  <link rel="stylesheet" th:href="@{/admin-pico/css/admin-layout.css}">
  <link rel="stylesheet" th:href="@{/admin-pico/css/admin-components.css}">
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="admin-body" data-sidebar-open="false">
<button class="admin-mobile-toggle secondary" type="button" data-sidebar-toggle>メニュー</button>
<div class="admin-sidebar-backdrop" data-sidebar-backdrop></div>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__inner">
      <div class="admin-brand">
        <div class="admin-brand__mark">N</div>
        <div><strong>投稿ノート</strong><div class="admin-brand__eyebrow">Pico Notes</div></div>
        <button class="secondary" type="button" data-sidebar-close>閉じる</button>
      </div>
      <nav class="admin-nav" aria-label="メインメニュー">
        <details open>
          <summary>投稿</summary>
          <ul>
            <li><a class="admin-nav-item" th:href="@{/posts}" th:attr="aria-current=${nav == 'posts' ? 'page' : null}">投稿一覧</a></li>
            <li><a class="admin-nav-item" th:href="@{/posts/new}" th:attr="aria-current=${nav == 'new' ? 'page' : null}">新規投稿</a></li>
          </ul>
        </details>
        <details open>
          <summary>投稿者</summary>
          <ul>
            <li><a class="admin-nav-item" th:href="@{/users}" th:attr="aria-current=${nav == 'users' ? 'page' : null}">投稿者の管理</a></li>
          </ul>
        </details>
      </nav>
      <div class="notes-sidebar-footer">
        <span class="admin-badge" th:classappend="${imagesEnabled == true ? 'admin-badge--lime' : 'admin-badge--neutral'}"
              th:text="${imagesEnabled == true ? '画像添付 ON' : '画像添付 OFF'}"></span>
      </div>
    </div>
  </aside>
  <main class="admin-main">
    <header class="admin-header">
      <div th:replace="${heading}"></div>
      <div class="admin-header__actions">
        <div th:replace="${actions}"></div>
        <a class="admin-user-chip notes-author-chip" th:href="@{/users}" aria-label="選択中の投稿者。切り替えは投稿者の管理で行います">
          <span class="admin-avatar" aria-hidden="true" th:text="${currentAuthor == null ? '?' : currentAuthor.initial()}"></span>
          <span class="admin-user__meta">
            <strong th:text="${currentAuthor == null ? '未選択' : currentAuthor.name}"></strong>
            <small>選択中の投稿者</small>
          </span>
        </a>
      </div>
    </header>
    <section class="admin-content">
      <div class="admin-note admin-note--neutral" role="status" th:if="${message}" th:text="${message}"></div>
      <div class="admin-note" role="alert" th:if="${error}" th:text="${error}"></div>
      <div th:replace="${content}"></div>
    </section>
  </main>
</div>
<script th:src="@{/admin-pico/js/admin.js}"></script>
</body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'users', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>投稿者の管理 | 投稿ノート</title></head>
<body>
<div id="heading">
  <div class="admin-eyebrow">AUTHORS</div>
  <h1>投稿者の管理</h1>
  <p>投稿者を追加し、投稿に使う投稿者を選びます。ログイン機能ではありません。</p>
</div>
<div id="actions"></div>
<div id="content" class="admin-grid admin-grid--sidebar">
  <article class="admin-card">
    <header class="admin-toolbar">
      <div class="admin-toolbar__group">
        <h2>投稿者</h2>
        <span class="admin-badge admin-badge--neutral" th:text="${#lists.size(authors) + ' 人'}"></span>
      </div>
    </header>
    <div class="admin-card__body" th:if="${#lists.isEmpty(authors)}">
      <div class="admin-note admin-note--neutral">
        <strong>投稿者はまだいません。</strong><div>右のフォームから追加してください。</div>
      </div>
    </div>
    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(authors)}">
      <table class="admin-table notes-table">
        <thead>
          <tr><th>名前</th><th>投稿数</th><th>登録日</th><th class="admin-text-right">操作</th></tr>
        </thead>
        <tbody>
          <tr th:each="author : ${authors}" th:attr="data-author=${author.name}">
            <td>
              <div class="admin-user">
                <span class="admin-avatar" aria-hidden="true" th:text="${author.initial()}"></span>
                <div class="admin-user__meta">
                  <strong th:text="${author.name}"></strong>
                  <span class="admin-badge admin-badge--lime" th:if="${currentAuthor != null and currentAuthor.id == author.id}">選択中</span>
                </div>
              </div>
            </td>
            <td data-label="投稿数"><a th:href="@{/posts(userId=${author.id})}" th:text="${author.postCount + ' 件'}"></a></td>
            <td data-label="登録日" th:text="${author.createdLabel()}"></td>
            <td>
              <div class="notes-row-actions">
                <form th:action="@{/users/{id}/select(id=${author.id})}" method="post">
                  <button type="submit" class="secondary" th:attr="aria-label=${author.name + 'で投稿'}">この投稿者で投稿</button>
                </form>
                <form th:if="${author.postCount == 0}" th:action="@{/users/{id}/delete(id=${author.id})}" method="post"
                      onsubmit="return confirm('この投稿者を削除します。よろしいですか？')">
                  <button type="submit" class="outline secondary" th:attr="aria-label=${author.name + 'を削除'}">削除</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </article>
  <aside class="admin-card">
    <header><h2>投稿者を追加</h2></header>
    <div class="admin-card__body">
      <form class="admin-stack" th:action="@{/users}" method="post">
        <div>
          <label for="name">投稿者名</label>
          <input id="name" name="name" maxlength="80" required placeholder="例：山田">
          <small>追加した投稿者が、そのまま選択中になります。</small>
        </div>
        <button type="submit">追加して選択</button>
      </form>
      <p class="notes-muted">投稿が残っている投稿者は削除できません。先に投稿を削除してください。</p>
    </div>
  </aside>
</div>
</body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'posts', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title th:text="${post.title + ' | 投稿ノート'}">投稿詳細 | 投稿ノート</title></head>
<body>
<div id="heading">
  <div class="admin-eyebrow">POST</div>
  <h1 class="notes-title" th:text="${post.title}"></h1>
  <p th:text="${post.userName + ' ・ ' + post.createdLabel()}"></p>
</div>
<div id="actions" class="notes-page-actions">
  <a role="button" class="secondary" th:href="@{/posts}">一覧へ戻る</a>
</div>
<div id="content" class="admin-grid admin-grid--sidebar">
  <article class="admin-card">
    <div class="admin-card__body">
      <p class="notes-post-body" th:if="${!#strings.isEmpty(post.body)}" th:text="${post.body}"></p>
      <p class="notes-muted" th:if="${#strings.isEmpty(post.body)}">本文はありません。</p>
      <img class="notes-post-image" th:if="${imagesEnabled and post.imageKey != null}"
           th:src="@{/posts/{id}/image(id=${post.id})}" th:alt="${post.title + 'の添付画像'}">
      <p class="notes-muted" th:if="${!imagesEnabled and post.imageKey != null}">画像機能をONにすると、添付画像を表示できます。</p>
    </div>
  </article>
  <aside class="admin-card">
    <header><h2>投稿の情報</h2></header>
    <div class="admin-card__body admin-stack">
      <div class="admin-detail-grid">
        <div class="admin-detail-item"><span>投稿者</span><strong><a th:href="@{/posts(userId=${post.userId})}" th:text="${post.userName}"></a></strong></div>
        <div class="admin-detail-item"><span>投稿日時</span><strong th:text="${post.createdLabel()}"></strong></div>
        <div class="admin-detail-item"><span>画像</span><strong th:text="${post.imageKey == null ? 'なし' : 'あり'}"></strong></div>
        <div class="admin-detail-item"><span>本文</span><strong th:text="${#strings.length(post.body) + ' 文字'}"></strong></div>
      </div>
      <a role="button" class="secondary" th:href="@{/posts/new(userId=${post.userId})}">この投稿者で新規投稿</a>
      <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
            onsubmit="return confirm('この投稿を削除します。元に戻せません。よろしいですか？')">
        <button type="submit" class="notes-danger" th:disabled="${!imagesEnabled and post.imageKey != null}">投稿を削除</button>
        <small th:if="${!imagesEnabled and post.imageKey != null}">画像つきの投稿は、画像機能ONのときに削除できます。</small>
      </form>
    </div>
  </aside>
</div>
</body>
</html>

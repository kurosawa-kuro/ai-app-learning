<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'new', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>新規投稿 | 投稿ノート</title></head>
<body>
<div id="heading">
  <div class="admin-eyebrow">NEW POST</div>
  <h1>新規投稿</h1>
  <p>投稿者を選び、タイトルと本文を入力して保存します。</p>
</div>
<div id="actions" class="notes-page-actions">
  <a role="button" class="secondary" th:href="@{/posts}">一覧へ戻る</a>
</div>
<div id="content">
  <div class="admin-note admin-note--neutral" th:if="${#lists.isEmpty(authors)}">
    <strong>投稿者がまだいません。</strong>
    <div><a th:href="@{/users}">投稿者の管理</a>で投稿者を追加すると、投稿できるようになります。</div>
  </div>
  <article class="admin-card notes-form-card" th:unless="${#lists.isEmpty(authors)}">
    <div class="admin-card__body">
      <form class="admin-stack" th:action="@{/posts}" method="post" enctype="multipart/form-data">
        <div>
          <label for="userId">投稿者</label>
          <select id="userId" name="userId" required>
            <option value="" th:selected="${form.userId == null}" disabled>選択してください</option>
            <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}"
                    th:selected="${form.userId == author.id}"></option>
          </select>
          <small>新しい投稿者は<a th:href="@{/users}">投稿者の管理</a>で追加できます。</small>
        </div>
        <div>
          <label for="title">タイトル <small>必須・120文字まで</small></label>
          <input id="title" name="title" maxlength="120" required th:value="${form.title}">
        </div>
        <div>
          <label for="body">本文 <small>5000文字まで</small></label>
          <textarea id="body" name="body" maxlength="5000" rows="10" th:text="${form.body}"></textarea>
        </div>
        <div th:if="${imagesEnabled}">
          <label for="image">画像 <small>任意・1枚</small></label>
          <input id="image" type="file" name="image" accept="image/jpeg,image/png" aria-describedby="image-help">
          <small id="image-help">JPEG・PNG / 5MB・1600万画素まで</small>
        </div>
        <div class="notes-form-actions">
          <a role="button" class="secondary" th:href="@{/posts}">キャンセル</a>
          <button type="submit">投稿を保存</button>
        </div>
      </form>
    </div>
  </article>
</div>
</body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'posts', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>投稿一覧 | 投稿ノート</title></head>
<body>
<div id="heading">
  <div class="admin-eyebrow">POSTS</div>
  <h1>投稿一覧</h1>
  <p th:text="${selectedAuthor == null ? 'すべての投稿を新しい順に表示します。' : selectedAuthor.name + ' の投稿を新しい順に表示します。'}"></p>
</div>
<div id="actions" class="notes-page-actions">
  <a role="button" th:href="${selectedAuthor == null} ? @{/posts/new} : @{/posts/new(userId=${selectedAuthor.id})}">新規投稿</a>
</div>
<div id="content">
  <article class="admin-card">
    <header class="admin-toolbar">
      <div class="admin-toolbar__group">
        <h2>投稿</h2>
        <span class="admin-badge admin-badge--neutral" th:text="${#lists.size(posts) + ' 件'}"></span>
      </div>
      <form class="admin-toolbar__group notes-filter" method="get" th:action="@{/posts}">
        <label class="admin-inline-control">
          <span>投稿者</span>
          <select name="userId" aria-label="投稿者">
            <option value="">すべて</option>
            <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}"
                    th:selected="${selectedAuthor != null and selectedAuthor.id == author.id}"></option>
          </select>
        </label>
        <button class="secondary" type="submit">絞り込む</button>
      </form>
    </header>
    <div class="admin-card__body" th:if="${#lists.isEmpty(posts)}">
      <div class="admin-note admin-note--neutral">
        <strong>投稿はまだありません。</strong>
        <div><a th:href="${selectedAuthor == null} ? @{/posts/new} : @{/posts/new(userId=${selectedAuthor.id})}">新規投稿</a>から最初の投稿を作成できます。</div>
      </div>
    </div>
    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(posts)}">
      <table class="admin-table notes-table">
        <thead>
          <tr><th>タイトル</th><th>投稿者</th><th>投稿日時</th><th class="admin-text-right">操作</th></tr>
        </thead>
        <tbody>
          <tr th:each="post : ${posts}" th:attr="data-post-id=${post.id}">
            <td>
              <a class="notes-post-link" th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a>
              <span class="admin-badge admin-badge--lime" th:if="${post.imageKey != null}">写真</span>
              <small class="notes-excerpt" th:if="${!#strings.isEmpty(post.body)}" th:text="${post.excerpt()}"></small>
            </td>
            <td data-label="投稿者"><a th:href="@{/posts(userId=${post.userId})}" th:text="${post.userName}"></a></td>
            <td data-label="投稿日時" th:text="${post.createdLabel()}"></td>
            <td class="admin-text-right"><a th:href="@{/posts/{id}(id=${post.id})}">詳細</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </article>
</div>
</body>
</html>

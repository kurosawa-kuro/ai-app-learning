<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, '', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>エラー | 投稿ノート</title></head>
<body>
<div id="heading">
  <div class="admin-eyebrow" th:text="${status}">ERROR</div>
  <h1 th:text="${status == 404 ? 'ページが見つかりません' : '処理できませんでした'}">エラー</h1>
  <p th:text="${status == 404 ? '削除済みの投稿か、URLが間違っている可能性があります。' : '時間をおいて、もう一度お試しください。'}"></p>
</div>
<div id="actions" class="notes-page-actions">
  <a role="button" th:href="@{/posts}">投稿一覧へ</a>
</div>
<div id="content"></div>
</body>
</html>

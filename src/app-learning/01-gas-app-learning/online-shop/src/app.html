<script>
  const $ = (selector) => document.querySelector(selector);
  let products = [];
  let confirmed = null,
    unresolved = false,
    activeUser = "";
  const yen = (amount) => `${amount.toLocaleString("ja-JP")} 円`;
  function selectedItems() {
    return products
      .map((p) => ({
        productId: p.id,
        price: p.price,
        quantity: Number(document.getElementById("qty-" + p.id).value),
      }))
      .filter((i) => i.quantity > 0);
  }
  function total() {
    $("#total").textContent =
      "合計 " +
      yen(selectedItems().reduce((sum, i) => sum + i.price * i.quantity, 0));
  }
  function showDetail(order) {
    const panel = $("#detail");
    panel.replaceChildren(
      Ui.node("p", `${order.created_at}　${order.userName}`),
    );
    order.items.forEach((i) =>
      panel.append(
        Ui.node(
          "p",
          `${i.product_name}：${yen(i.unit_price)} × ${i.quantity} 個 = ${yen(i.unit_price * i.quantity)}`,
        ),
      ),
    );
    panel.append(
      Ui.node("p", "合計 " + yen(order.total), "total"),
      Ui.node("p", "注文ID：" + order.id, "help"),
    );
    $("#detail-section").hidden = false;
  }
  async function history() {
    const panel = $("#history");
    if (!$("#user").value) {
      panel.replaceChildren(
        Ui.node("p", "注文する人を選ぶと、注文一覧を確認できます。"),
      );
      return;
    }
    const rows = await Ui.rpc("orders", { userId: $("#user").value });
    panel.replaceChildren(
      ...rows.map((row) => {
        const card = Ui.node("article"),
          button = Ui.node("button", "明細を見る");
        button.type = "button";
        button.className = "secondary outline";
        button.onclick = () =>
          Ui.run(button, async () =>
            showDetail(
              await Ui.rpc("detail", { id: row.id, userId: $("#user").value }),
            ),
          );
        card.append(
          Ui.node("h3", row.created_at),
          Ui.node(
            "p",
            row.items
              .map((i) => `${i.product_name} × ${i.quantity}`)
              .join("／"),
          ),
          Ui.node("p", yen(row.total), "total"),
          button,
        );
        return card;
      }),
    );
    if (!rows.length)
      panel.append(
        Ui.node(
          "p",
          "注文はまだありません。商品を選んで最初の注文を保存しましょう。",
        ),
      );
  }
  async function catalog() {
    const previous = new Map(
      [...document.querySelectorAll("[data-quantity]")].map((el) => [
        el.dataset.quantity,
        el.value,
      ]),
    );
    const data = await Ui.rpc("catalog");
    products = data.products;
    Ui.options($("#user"), data.users, "注文する人を選択");
    $("#products").replaceChildren(
      ...products.map((p) => {
        const line = Ui.node("div", null, "order-line"),
          label = Ui.node("label", `${p.name}　${yen(p.price)}`),
          input = Ui.node("input");
        input.id = "qty-" + p.id;
        input.type = "number";
        input.min = 0;
        input.max = 99;
        input.step = 1;
        input.required = true;
        input.value = previous.get(p.id) || "0";
        input.dataset.quantity = p.id;
        input.setAttribute("aria-label", p.name + "の数量");
        input.oninput = total;
        label.htmlFor = input.id;
        line.append(label, input);
        return line;
      }),
    );
    total();
    await history();
  }
  $("#user").onchange = () => {
    if (
      selectedItems().length &&
      !confirm("選択中の数量を破棄して注文する人を切り替えますか？")
    ) {
      $("#user").value = activeUser;
      return;
    }
    activeUser = $("#user").value;
    return Ui.run(null, async () => {
      $("#detail-section").hidden = true;
      document
        .querySelectorAll("[data-quantity]")
        .forEach((el) => (el.value = "0"));
      Ui.clear("order");
      total();
      await history();
    });
  };
  $("#reload").onclick = (e) => Ui.run(e.currentTarget, catalog);
  $("#order-form").onsubmit = (e) => {
    e.preventDefault();
    if (Ui.busy || unresolved) return;
    const items = selectedItems();
    if (!items.length) {
      $("#status").textContent = "注文する商品と数量を指定してください。";
      $("#status").focus();
      return;
    }
    confirmed = { userId: $("#user").value, items };
    $("#confirmation").replaceChildren(
      Ui.node("h3", "注文する人：" + $("#user").selectedOptions[0].textContent),
    );
    items.forEach((i) =>
      $("#confirmation").append(
        Ui.node(
          "p",
          `${products.find((p) => p.id === i.productId).name}：${yen(i.price)} × ${i.quantity} 個 = ${yen(i.price * i.quantity)}`,
        ),
      ),
    );
    $("#confirmation").append(
      Ui.node(
        "p",
        "合計 " + yen(items.reduce((sum, i) => sum + i.price * i.quantity, 0)),
        "total",
      ),
    );
    $("#order-state").textContent =
      "未確定です。「注文を確定する」を押すと保存します。";
    $("#selection-section").hidden = true;
    $("#confirmation-section").hidden = false;
    $("#history-section").hidden = true;
    $("#detail-section").hidden = true;
    $("#confirmation-section h2").focus();
  };
  $("#back-order").onclick = () => {
    if (Ui.busy || unresolved) return;
    confirmed = null;
    $("#confirmation-section").hidden = true;
    $("#selection-section").hidden = false;
    $("#history-section").hidden = false;
    $("#submit-order").focus();
  };
  $("#confirm-order").onclick = async (e) => {
    if (Ui.busy || !confirmed) return;
    const payload = confirmed,
      requestId = Ui.pending("order", payload);
    await Ui.run(
      e.currentTarget,
      async () => {
        $("#order-state").textContent = "注文を保存しています…";
        let order;
        try {
          order = await Ui.rpc("createOrder", { ...payload, requestId });
        } catch (error) {
          unresolved = Boolean(error.uncertain);
          $("#order-state").textContent = unresolved
            ? "注文済みの可能性があります。同じ内容のまま「注文を確定する」で結果を確認してください。二重には登録しません。"
            : error.message +
              " 数量を変更する画面へ戻り、必要なら商品・注文を再読込してください。";
          throw error;
        }
        unresolved = false;
        confirmed = null;
        showDetail(order);
        Ui.clear("order");
        $("#confirmation-section").hidden = true;
        $("#selection-section").hidden = false;
        $("#history-section").hidden = false;
        $("#detail-section h2").tabIndex = -1;
        $("#detail-section h2").focus();
        document
          .querySelectorAll("[data-quantity]")
          .forEach((el) => (el.value = "0"));
        total();
        try {
          await history();
        } catch {
          throw new Error(
            "注文は保存済みです。注文一覧を取得できませんでした。「商品・注文を再読込」で確認してください。",
          );
        }
      },
      "注文を保存しました。明細と注文一覧で確認できます。",
    );
    $("#back-order").disabled = unresolved;
  };
  window.addEventListener("beforeunload", (event) => {
    if (Ui.busy || unresolved || selectedItems().length) {
      event.preventDefault();
      event.returnValue = "";
    }
  });
  Ui.run(
    null,
    catalog,
    "準備できました。注文する人と商品の数量を選んでください。",
  );
</script>

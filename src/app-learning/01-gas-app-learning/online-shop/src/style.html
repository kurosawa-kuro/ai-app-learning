<style>
:root[data-theme="light"] { color-scheme: light; --pico-font-family: system-ui,sans-serif; --pico-font-size:100%; --pico-primary:#c92a6b; --pico-primary-background:#c92a6b; --pico-primary-border:#c92a6b; --pico-primary-hover-background:#ac1f5a; --pico-primary-hover-border:#ac1f5a; --pico-border-radius:14px; --pico-form-element-border-color:#e8c9da; --pico-color:#2b2233; --pico-muted-color:#6e6276; --pico-form-element-background-color:#fff; }
* { box-sizing:border-box; } [hidden] {display:none!important} body {margin:0;background:radial-gradient(at top right,#ffe0ed,transparent 50%),linear-gradient(135deg,#fff7fa,#f6efff);min-height:100vh} header {background:#fff;padding:1rem max(1rem,calc((100% - 1120px)/2));border-bottom:1px solid #f4e1eb} header p {margin:0;color:#6e6276} header h1 {font-size:1.65rem;margin:.1rem 0 .5rem} main {max-width:1152px;margin:auto;padding:1.5rem 1rem 4rem} nav {display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem} nav a {padding:.5rem .8rem;background:#fff3f8;border-radius:999px;text-decoration:none} article {padding:1.3rem;background:#fff;border:1px solid #f4e1eb;box-shadow:0 8px 24px #6e38600a;margin:1rem 0 1.5rem} article h2 {font-size:1.25rem} .form-panel {max-width:800px;margin-left:auto;margin-right:auto} .fields {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1rem} .fields>* {min-width:0} input,select {width:100%} .notice {padding:.8rem 1rem;border-left:4px solid #c92a6b;background:#fff;border-radius:10px;margin:0 0 1.2rem} .notice:empty{display:none} .error {border-color:#b71c36;color:#8f1830} .help {color:#6e6276;font-size:.95rem} .scroll {overflow-x:auto} th,td {white-space:nowrap} .result-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1rem} .result-card {padding:1rem;border:1px solid #f4e1eb;border-radius:14px} .result-card h3 {font-size:1.1rem} .result-card p:last-child {margin:0} .stack {display:grid;gap:.6rem} .order-line {display:grid;grid-template-columns:1fr 110px;gap:1rem;align-items:center;border-bottom:1px solid #f4e1eb;padding:.6rem 0} .order-line label {margin:0} .order-line p {margin:.2rem 0} .order-line input {margin:0} .total {font-size:1.25rem;font-weight:700;margin:1rem 0} #detail {scroll-margin-top:1rem} button {min-height:44px} section,article {scroll-margin-top:1rem} @media(max-width:550px) {.fields{grid-template-columns:1fr} main{padding:.9rem 1rem 3rem} article{padding:1rem} header h1{font-size:1.4rem} .order-line{grid-template-columns:1fr 84px}}

main>header {padding:1.2rem;border-radius:16px 16px 0 0}

# Render Blueprint. When creating it, set Blueprint Path to src/app-learning/02-web-app-learning/skill-janken-game/render.yaml.
# Docker paths are relative to rootDir.
services:
  - type: web
    name: learning-skill-janken-game
    runtime: docker
    plan: free
    region: singapore
    rootDir: src/app-learning/02-web-app-learning/skill-janken-game
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_AI_MODE
        value: demo
      - key: SUPABASE_STORAGE_BUCKET
        value: skill-janken-game-images-render
      - key: APP_DB_SCHEMA
        sync: false
      # Entered once in the Dashboard at Blueprint creation; never committed.
      - key: DB_HOST
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT
        value: 20s
      # To enable images, also add SUPABASE_URL and SUPABASE_SECRET_KEY in the Dashboard.
      - key: APP_IMAGES_ENABLED
        value: "false"

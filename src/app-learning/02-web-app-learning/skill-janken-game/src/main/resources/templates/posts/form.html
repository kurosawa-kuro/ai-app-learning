<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title th:text="${editingId == null ? '新規投稿 | 投稿ノート' : '投稿編集 | 投稿ノート'}">投稿ノート</title></head>
<body>
<div id="heading"><h1 th:text="${editingId == null ? '新規投稿' : '投稿を編集'}">新規投稿</h1><p>投稿者を確認して、伝えたいことを残しましょう。</p></div>
<div id="actions"></div>
<div id="content">
  <article class="admin-card"><div class="admin-card__body">
    <form class="ui-stack" th:action="${editingId == null ? '/posts' : '/posts/' + editingId + '/edit'}" method="post" enctype="multipart/form-data" data-ui-form data-post-form data-unsaved-form>
      <input type="hidden" name="requestId" th:value="${requestId}">
      <input th:if="${editingId != null}" type="hidden" name="version" th:value="${editVersion}">
      <div class="ui-notice ui-notice--error" role="alert" tabindex="-1" data-post-error hidden></div>
      <input th:if="${editingId != null}" type="hidden" id="userId" name="userId" th:value="${form.userId}">
      <p th:if="${editingId != null}" th:text="${'投稿者：' + savedPost.userName}"></p>
      <details th:if="${editingId == null}" class="post-author" th:open="${chosenAuthor == null}" id="author-picker">
        <summary>投稿者：<strong data-author-name th:text="${chosenAuthor == null ? '選択してください' : chosenAuthor.name}"></strong><span>変更・追加</span></summary>
        <label for="userId">投稿者 <span class="ui-field-kind">必須</span></label>
        <select id="userId" name="userId" required aria-describedby="userId-error">
          <option value="" th:selected="${chosenAuthor == null}">選択してください</option>
          <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}" th:selected="${form.userId == author.id}"></option>
        </select>
        <p id="userId-error" class="ui-field-error" th:text="${fieldErrors['userId']}"></p>
        <div class="post-author-new" data-inline-author>
          <label for="newAuthorName">新しい投稿者名</label>
          <input id="newAuthorName" maxlength="80" autocomplete="off" aria-describedby="new-author-error">
          <button type="button" class="secondary" data-add-author>追加してこの投稿で使う</button>
          <p id="new-author-error" class="ui-field-error" role="alert"></p>
          <p class="ui-help">入力中のタイトル・本文を残したまま追加できます。</p>
        </div>
        <noscript><p><a th:href="@{/admin/users}" target="_blank" rel="noopener">別タブでユーザー管理を開く</a>。追加後、この画面を再読込みしてください。</p></noscript>
      </details>
      <div th:replace="~{ui/form :: text('title', 'タイトル', true, '120文字まで', ${form.title}, 120, ${fieldErrors['title']})}"></div>
      <div th:replace="~{ui/form :: textAreaField('body', '本文', '5000文字まで。改行も保存されます。', ${form.body}, 5000, ${fieldErrors['body']})}"></div>
      <section th:if="${editingId != null and savedPost.imageKey != null}" class="post-saved-image">
        <p>保存済みの画像</p><img class="post-image" th:src="@{/posts/{id}/image(id=${editingId})}" alt="保存済みの投稿画像">
        <label><input type="checkbox" name="removeImage" value="true">保存済みの画像を外す</label>
        <small>新しい画像を選択すると差し替えます。どちらも選ばなければ元の画像を維持します。</small>
      </section>
      <div class="ui-field" th:if="${imagesEnabled}" data-image-picker>
        <label for="image">画像 <span class="ui-field-kind">任意</span></label>
        <p id="image-help" class="ui-help">JPEG・PNGを1枚。5MB・1600万画素まで。</p>
        <input id="image" type="file" name="image" accept="image/jpeg,image/png" aria-describedby="image-help image-error" data-image-input>
        <img class="ui-image-preview" data-image-preview alt="投稿画像のプレビュー" hidden>
        <p data-image-preview-error class="ui-field-error" role="alert"></p>
        <button type="button" class="secondary" data-clear-image>画像の選択を解除</button>
        <p id="image-error" class="ui-field-error" th:text="${fieldErrors['image']}"></p>
        <small th:if="${error}">画面が再表示された場合、画像はもう一度選択してください。</small>
      </div>
      <p class="ui-help" th:unless="${imagesEnabled}">画像投稿は現在OFFです。タイトルと本文を投稿できます。</p>
      <section class="ui-stack" data-ai-draft aria-labelledby="ai-draft-heading">
        <h2 id="ai-draft-heading">AIで本文の下書きを作る</h2>
        <p class="ui-help">本文と、今回選択した画像をGeminiへ送ります。保存済みの画像は送りません。生成だけでは投稿を保存しません。</p>
        <button type="button" class="secondary" data-ai-generate>AIで下書きを作る</button>
        <button type="button" class="secondary" data-ai-check hidden>同じ要求の結果を確認</button>
        <p role="status" aria-live="polite" data-ai-status></p>
        <div data-ai-result hidden>
          <label for="ai-draft-text">生成された下書き</label>
          <textarea id="ai-draft-text" readonly rows="6" data-ai-text></textarea>
          <button type="button" data-ai-apply>本文へ反映</button>
          <button type="button" class="secondary" data-ai-discard>破棄</button>
        </div>
      </section>
      <div th:replace="~{ui/form :: actions('/posts', 'キャンセル', '投稿を保存')}"></div>
    </form>
  </div></article>
</div>
</body>
</html>

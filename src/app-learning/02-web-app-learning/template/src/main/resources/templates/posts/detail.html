<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'detail', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title th:text="${post.title + ' | 投稿ノート'}">投稿詳細</title></head>
<body>
<div id="heading"><h1 th:text="${post.title}"></h1></div>
<div id="actions"><a th:href="@{/posts}">投稿一覧へ戻る</a></div>
<div id="content">
  <article th:replace="~{ui/collection :: detail(~{::#reading}, ~{::#metadata}, ~{::#next-actions})}"></article>
  <details class="ui-danger-zone"><summary>この投稿を削除する</summary>
    <p>投稿と添付画像を削除します。元に戻せません。</p>
    <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" data-ui-form data-busy-text="削除中…"
          th:attr="data-confirm=${'「' + post.title + '」を削除します。'}">
      <button type="submit" class="ui-danger">投稿を削除</button>
      <small th:if="${!storageConfigured and post.imageKey != null}">画像の後片付けは保留されます。接続の復旧後、提供者がseed-cleanupで再試行できます。</small>
    </form>
  </details>
</div>
<div id="metadata"><span class="ui-author-label"><span th:replace="~{ui/avatar :: avatar(${post.userName}, ${userIconIds.contains(post.userId) ? '/admin/users/' + post.userId + '/icon' : null})}"></span><span>投稿者：<a th:href="@{/posts(userId=${post.userId})}" th:text="${post.userName}"></a></span></span> ・ <time th:text="${post.createdLabel()}"></time></div>
<div id="reading">
  <p class="post-body" th:if="${!#strings.isEmpty(post.body)}" th:text="${post.body}"></p>
  <p class="ui-muted" th:if="${#strings.isEmpty(post.body)}">本文はありません。</p>
  <th:block th:if="${post.imageKey != null}"><div th:replace="~{posts/image :: image(${post.id}, ${post.title}, true)}"></div></th:block>
  <p th:if="${!storageConfigured and post.imageKey != null}">画像ストレージが未設定のため、添付画像を表示できません。</p>
</div>
<div id="next-actions" class="ui-actions"><a role="button" th:href="@{/posts/{id}/edit(id=${post.id})}">投稿を編集</a><a role="button" class="secondary" th:href="@{/posts/new(userId=${post.userId})}">この投稿者で新規投稿</a></div>
</body>
</html>

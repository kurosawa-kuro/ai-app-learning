<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'standard', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>ユーザー管理 | 投稿ノート</title></head>
<body>
<div id="heading">
  <h1>ユーザー管理</h1>
  <p>ユーザーを作成・選択します。この投稿アプリでは投稿者として使います。</p>
</div>
<div id="actions"><a th:href="@{/admin}">管理画面へ戻る</a></div>
<div id="content" class="ui-admin-grid">
  <article class="admin-card">
    <header class="admin-toolbar">
      <div class="admin-toolbar__group">
        <h2>ユーザー一覧</h2>
        <span class="admin-badge admin-badge--neutral" th:text="${#lists.size(authors) + ' 人'}"></span>
      </div>
    </header>
    <div class="admin-card__body" th:if="${#lists.isEmpty(authors)}">
      <div class="admin-note admin-note--neutral">
        <strong>ユーザーはまだいません。</strong><div>「ユーザーを作成」から追加してください。</div>
      </div>
    </div>
    <div class="admin-table-wrap" th:unless="${#lists.isEmpty(authors)}">
      <table class="admin-table ui-table">
        <thead>
          <tr><th>名前</th><th>投稿数</th><th>登録日</th><th class="admin-text-right">操作</th></tr>
        </thead>
        <tbody>
          <tr th:each="author : ${authors}" th:attr="data-author=${author.name}">
            <td>
              <div class="admin-user">
                <span th:replace="~{ui/avatar :: avatar(${author.name}, ${userIconIds.contains(author.id) ? '/admin/users/' + author.id + '/icon' : null})}"></span>
                <div class="admin-user__meta">
                  <strong th:text="${author.name}"></strong>
                  <span class="admin-badge admin-badge--lime" th:if="${currentAuthor != null and currentAuthor.id == author.id}">選択中</span>
                  <span class="admin-badge admin-badge--neutral" th:if="${defaultUserId == author.id}">デフォルト</span>
                </div>
              </div>
            </td>
            <td data-label="投稿数"><a th:href="@{/posts(userId=${author.id})}" th:text="${author.postCount + ' 件'}"></a></td>
            <td data-label="登録日" th:text="${author.createdLabel()}"></td>
            <td>
              <div class="ui-row-actions"><a th:href="@{/admin/users/{id}/edit(id=${author.id})}" th:attr="aria-label=${author.name + 'の名前を変更'}">名前を変更</a>
                <a th:href="@{/admin/users/{id}/icon/edit(id=${author.id})}" th:attr="aria-label=${author.name + 'のアイコンを変更'}">アイコンを変更</a>
                <form th:action="@{/admin/users/{id}/select(id=${author.id})}" method="post" data-ui-form>
                  <button type="submit" class="secondary" th:attr="aria-label=${author.name + 'で投稿'}">この投稿者で投稿</button>
                </form>
                <form th:if="${author.postCount == 0}" th:action="@{/admin/users/{id}/delete(id=${author.id})}" method="post" data-ui-form
                      th:attr="data-confirm=${'「' + author.name + '」を削除します。'}" data-busy-text="削除中…">
                  <button type="submit" class="outline secondary" th:attr="aria-label=${author.name + 'を削除'}">削除</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </article>
  <aside class="admin-card">
    <header><h2>ユーザーを作成</h2></header>
    <div class="admin-card__body">
      <form class="admin-stack" th:action="@{/admin/users}" method="post" data-ui-form>
        <div th:replace="~{ui/form :: text('name', '投稿者名', true, '80文字まで。追加した投稿者が選択中になります。', ${draftName}, 80, ${fieldErrors == null ? null : fieldErrors['name']})}"></div>
        <button type="submit">追加して選択</button>
      </form>
      <hr>
      <form class="admin-stack" th:action="@{/admin/users/default}" method="post" data-ui-form>
        <div>
          <label for="defaultUserId">デフォルトユーザー</label>
          <select id="defaultUserId" name="userId" aria-describedby="default-user-help">
            <option value="" th:selected="${defaultUserId == null}">指定しない</option>
            <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}"
                    th:selected="${defaultUserId == author.id}"></option>
          </select>
          <small id="default-user-help">ユーザーをまだ選んでいないブラウザーで使います。すでに選択したユーザーは変わりません。</small>
        </div>
        <button type="submit" class="secondary">デフォルトを保存</button>
      </form>
      <p class="ui-muted">デフォルトのユーザーを削除すると、デフォルト指定も解除されます。</p>
      <p class="ui-muted">投稿が残っている投稿者は削除できません。先に投稿を削除してください。</p>
    </div>
  </aside>
</div>
</body>
</html>

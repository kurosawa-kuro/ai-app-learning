<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, 'play', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>スキルじゃんけん | UI体験</title></head>
<body>
<div id="heading"><h1>スキルじゃんけん</h1><p>なかまとスキルを選んで、じゃんけんに挑戦。</p></div>
<div id="actions"><span class="admin-badge">体験用サンプル</span></div>
<div id="content" class="ui-stack" data-janken>
  <p class="ui-help">画面と操作を確かめるサンプルです。なかまは最初から全員選べます。GAS版への接続・記録の保存はありません。</p>
  <article class="admin-card"><div class="admin-card__body ui-stack">
    <div class="game-setup">
      <div class="ui-field"><label for="character">1. なかま</label><select id="character">
        <option value="hinoko">ひのこ</option><option value="shizuku">しずく</option><option value="konoha">このは</option>
      </select></div>
      <div class="ui-field"><label for="skill">2. スキル</label><select id="skill"></select></div>
    </div>
    <p class="ui-notice" id="skill-description"></p>
    <fieldset class="game-hands"><legend>3. 出す手を選ぶ</legend>
      <div class="game-hand-options">
      <label><input type="radio" name="hand" value="rock"><span class="game-symbol" aria-hidden="true">✊</span><strong>グー</strong></label>
      <label><input type="radio" name="hand" value="scissors"><span class="game-symbol" aria-hidden="true">✌</span><strong>チョキ</strong></label>
      <label><input type="radio" name="hand" value="paper"><span class="game-symbol" aria-hidden="true">✋</span><strong>パー</strong></label>
      </div>
    </fieldset>
    <p class="ui-help" id="hand-help">手を選んでから、決定ボタンを押します。</p>
    <button type="button" id="play-round" disabled>この手でじゃんけん！</button>
    <section class="game-result" id="game-result" tabindex="-1" aria-live="polite" hidden>
      <h2 id="round-title"></h2><p id="round-detail"></p><p id="round-points"></p>
      <button type="button" class="secondary" id="next-round">もう一度あそぶ</button>
    </section>
  </div></article>
  <p class="game-score">この画面での合計：<strong id="total-points">0</strong> ポイント <span class="ui-help">再読込みするとリセットされます。</span></p>
  <details><summary>スキルとポイントのしくみ</summary><p>勝つと2点、あいこ・負けは1点。スキルの条件に合うと、さらに1点。スキルは勝敗を変えません。</p></details>
  <noscript><p class="ui-notice">じゃんけん体験にはJavaScriptを有効にしてください。</p></noscript>
</div>
</body>
</html>

spring.application.name=WebAppTemplate
app.environment=${APP_ENVIRONMENT:local}
app.connection-label=${APP_CONNECTION_LABEL:Supabase PostgreSQL}
app.access.mode=${APP_ACCESS_MODE:local}
app.access.user=${APP_ACCESS_USER:starter}
app.access.password=${APP_ACCESS_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.schema=${APP_DB_SCHEMA:app_template}
spring.flyway.schemas=${APP_DB_SCHEMA:app_template}
spring.flyway.default-schema=${APP_DB_SCHEMA:app_template}
spring.flyway.clean-disabled=true
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.images.enabled=${APP_IMAGES_ENABLED:false}
app.storage.url=${SUPABASE_URL:}
app.storage.key=${SUPABASE_SECRET_KEY:}
app.storage.bucket=${SUPABASE_STORAGE_BUCKET:template-post-images-dev}

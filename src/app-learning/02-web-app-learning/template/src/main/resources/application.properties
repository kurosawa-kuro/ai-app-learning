spring.application.name=WebAppTemplate
app.environment=${APP_ENVIRONMENT:local}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.schema=${APP_DB_SCHEMA:app_template}
spring.flyway.schemas=${APP_DB_SCHEMA:app_template}
spring.flyway.default-schema=${APP_DB_SCHEMA:app_template}
spring.flyway.clean-disabled=true
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.images.enabled=${APP_IMAGES_ENABLED:false}
app.storage.url=${SUPABASE_URL:}
app.storage.key=${SUPABASE_SECRET_KEY:}
app.storage.bucket=${SUPABASE_STORAGE_BUCKET:template-post-images-dev}

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
app.openai.timeout=${OPENAI_TIMEOUT:20s}

# Content-versioned static URLs allow browser caching without stale files after deploy.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d

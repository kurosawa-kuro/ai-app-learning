# Container profile, activated by the Dockerfile. Local runs keep 127.0.0.1 and run-local.sh.
# Render routes to PORT on 0.0.0.0 and terminates TLS in front of the app.
server.address=0.0.0.0
app.environment=${APP_ENVIRONMENT:production}
server.port=${PORT:10000}
server.forward-headers-strategy=native
# Same TLS-verified Session pooler URL that run-local.ps1 builds. Render does not interpolate
# env values, so Spring resolves DB_HOST here. The CA path is relative to WORKDIR /app.
# Setting SPRING_DATASOURCE_URL in the environment overrides this line.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=verify-full&sslrootcert=certs/prod-ca-2021.crt&connectTimeout=10&socketTimeout=30

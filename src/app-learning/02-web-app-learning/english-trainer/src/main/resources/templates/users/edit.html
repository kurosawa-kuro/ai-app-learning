<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>ユーザー名の変更</title></head><body>
<div id="heading"><h1>ユーザー名の変更</h1><p>投稿とアイコンを引き継いで、表示名を変更します。</p></div><div id="actions"></div>
<div id="content"><article class="admin-card"><div class="admin-card__body"><form method="post" th:action="@{/admin/users/{id}/edit(id=${author.id})}" data-ui-form data-unsaved-form class="ui-stack">
<label for="name">ユーザー名</label><input id="name" name="name" th:value="${name}" required maxlength="80" autocomplete="off">
<div th:replace="~{ui/form :: actions('/admin/users', 'キャンセル', '名前を保存')}"></div>
</form></div></article></div></body></html>

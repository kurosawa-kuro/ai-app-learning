<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>英語をひとつ試そう</title></head><body><div id="heading"><h1>英語をひとつ試そう</h1><p>回答・フィードバック・振り返りを、少しずつ。</p></div><div id="actions"></div><div id="content" class="ui-stack"><nav class="ui-section-nav" aria-label="学習メニュー"><a href="#lesson-quiz">クイズ</a><a href="#lesson-chat">会話</a><a href="#lesson-reflect">振り返り</a><a href="#lesson-history">履歴</a></nav>
<form th:action="@{/learning}" method="get"><label>学習する人<select name="user" required><option th:each="u:${learners}" th:value="${u.id}" th:text="${u.name}" th:selected="${u.id==learner}"></option></select></label><button>履歴を切り替える</button></form><p th:if="${#lists.isEmpty(learners)}">まず<a th:href="@{/admin/users}">ユーザー管理</a>で学習する人を登録してください。</p>
<article class="admin-card"><div class="admin-card__body"><h2 id="lesson-quiz">クイズに答える</h2><form th:action="@{/learning}" method="post" data-learning-form data-unsaved-form class="ui-stack"><input type="hidden" name="user" th:value="${learner}"><input type="hidden" name="kind" value="QUIZ"><label>問題<select name="question"><option th:each="q:${questions}" th:value="${q.id}" th:text="${q.prompt}"></option></select></label><label>あなたの回答<textarea name="input" rows="3" maxlength="1000" required></textarea></label><button th:disabled="${learner==null}">クイズに答える</button><p data-learning-status role="status"></p><p data-learning-feedback style="white-space:pre-wrap"></p></form></div></article><article class="admin-card"><div class="admin-card__body"><h2 id="lesson-chat">英語で会話する</h2><form th:action="@{/learning}" method="post" data-learning-form data-unsaved-form class="ui-stack"><input type="hidden" name="user" th:value="${learner}"><input type="hidden" name="kind" value="CHAT"><label>伝えたいことを英語で<textarea name="input" rows="3" maxlength="1000" required></textarea></label><button th:disabled="${learner==null}">英語で会話する</button><p data-learning-status role="status"></p><p data-learning-feedback style="white-space:pre-wrap"></p></form></div></article><article class="admin-card"><div class="admin-card__body"><h2 id="lesson-reflect">振り返る</h2><form th:action="@{/learning}" method="post" data-learning-form data-unsaved-form class="ui-stack"><input type="hidden" name="user" th:value="${learner}"><input type="hidden" name="kind" value="REFLECT"><label>今日できたこと・難しかったこと<textarea name="input" rows="3" maxlength="1000" required></textarea></label><button th:disabled="${learner==null}">振り返る</button><p data-learning-status role="status"></p><p data-learning-feedback style="white-space:pre-wrap"></p></form></div></article><article class="admin-card"><div class="admin-card__body"><h2 id="lesson-history">学習履歴</h2><p>直近20件です。結果を保存したら再表示して確認できます。</p><a th:href="@{/learning(user=${learner})}">履歴を再表示</a><p th:if="${#lists.isEmpty(history)}">まだ履歴がありません。一つ回答してみましょう。</p><details th:each="h:${history}"><summary th:text="${h.question+' · '+h.createdLabel()}"></summary><p th:text="${h.input}" style="white-space:pre-wrap"></p><p th:text="${h.feedback}" style="white-space:pre-wrap"></p></details></div></article></div></body></html>

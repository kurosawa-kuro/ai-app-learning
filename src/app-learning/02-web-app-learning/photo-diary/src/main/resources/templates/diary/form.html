<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>日記を書く | 写真日記</title></head><body>
<div id="heading"><h1>今日を、ひとつ残そう</h1><p>写真とことばから下書きを作り、あなたの気持ちを書き足して保存します。</p></div><div id="actions"><a th:href="@{/diary}">日記一覧へ</a></div>
<div id="content"><article class="admin-card"><div class="admin-card__body">
<form th:action="@{/diary}" method="post" enctype="multipart/form-data" class="ui-stack" data-diary-form data-unsaved-form>
<input type="hidden" name="requestId" th:value="${requestId}"><p data-diary-error class="ui-notice ui-notice--error" role="alert" hidden></p>
<label>書く人<select name="userId" required><option value="">選んでください</option><option th:each="a:${authors}" th:value="${a.id}" th:text="${a.name}" th:selected="${currentAuthor != null and currentAuthor.id == a.id}"></option></select></label>
<p class="ui-help" th:if="${#lists.isEmpty(authors)}">まず<a th:href="@{/admin/users}">ユーザー管理</a>で名前を登録してください。</p>
<label>日付<input type="date" name="entryDate" th:value="${today}" required></label>
<label>タイトル<input name="title" maxlength="120" placeholder="今日の小さな発見" required></label>
<fieldset data-tag-picker data-limit="5"><legend>タグ（複数選択・5個まで）</legend>
<input type="hidden" name="tags" value=""><div class="tag-options"><label th:each="t:${tags}" class="tag-option"><input type="checkbox" data-tag th:value="${t}"><span th:text="${t}"></span></label></div>
<p class="ui-help" data-tag-count aria-live="polite">0 / 5個を選択</p><p class="ui-help">タグは<a th:href="@{/admin/tags}" target="_blank" rel="noopener">タグ管理（別タブ）</a>で追加できます。追加後は日記を書く前にこの画面を再読み込みしてください。</p></fieldset>
<label>写真（任意・3枚まで）<input id="diary-photos" name="photos" type="file" accept="image/png,image/jpeg" multiple></label>
<p class="ui-help">JPEG・PNGを1枚5MBまで。写真は選んだ順に保存します。画像投稿の許可が必要です。</p><div id="diary-previews" class="ui-stack"></div>
<label>今日のメモ<textarea id="diary-material" maxlength="4500" rows="3" placeholder="どこで、どんな気持ちだった？"></textarea></label>
<button type="button" class="secondary" id="diary-generate">AIで下書きを作る</button><p id="diary-ai-status" role="status"></p>
<section id="diary-draft" hidden><label>下書き<textarea id="diary-draft-text" readonly rows="5"></textarea></label><button type="button" id="diary-apply">本文へ反映</button><button type="button" class="secondary" id="diary-discard">破棄する</button></section>
<label>あなたの日記<textarea name="body" id="diary-body" maxlength="5000" rows="8" required placeholder="下書きを手直しするか、自分のことばで書いてください。"></textarea></label>
<p class="ui-help">保存前に内容を確認してください。保存後の編集・削除はこの教材の範囲に含めません。</p>
<div class="ui-actions"><a role="button" class="secondary" th:href="@{/diary}">戻る</a><button type="submit">日記を保存</button></div>
</form></div></article></div></body></html>

<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title>日記一覧 | 写真日記</title></head><body>
<div id="heading"><h1>日々のかけら</h1><p>写真とことばで、自分だけの記録を。</p></div><div id="actions"><a role="button" th:href="@{/diary/new}">日記を書く</a></div>
<div id="content"><form th:action="@{/diary}" method="get" class="diary-filter"><fieldset data-tag-picker><legend>タグで絞り込む（複数選択）</legend><input type="hidden" name="tag" th:value="${tag}"><div class="tag-options"><label th:each="t:${tags}" class="tag-option"><input type="checkbox" data-tag th:value="${t}" th:checked="${selectedTags.contains(t)}"><span th:text="${t}"></span></label></div><p class="ui-help">選んだタグのいずれかを含む日記を表示します。未選択ならすべて表示します。</p></fieldset><div class="ui-actions"><button type="submit" class="secondary">絞り込む</button><a th:href="@{/diary}">選択を解除</a></div></form>
<p th:text="${diaryPage.total + '件の日記'}"></p>
<article class="admin-card" th:if="${#lists.isEmpty(diaryPage.entries)}"><div class="admin-card__body"><h2>まだ日記がありません</h2><p>最初の写真や、今日のひとことを残してみましょう。</p><a th:href="@{/diary/new}">最初の日記を書く</a></div></article>
<div class="ui-stack"><article class="admin-card" th:each="e:${diaryPage.entries}" data-diary-entry><div class="admin-card__body"><p class="ui-muted"><time th:text="${e.entryDate}"></time> · <span th:text="${e.userName}"></span></p><h2><a th:href="@{/diary/{id}(id=${e.id})}" th:text="${e.title}"></a></h2><p th:text="${#strings.abbreviate(e.body,140)}"></p><a th:if="${e.coverId != null}" th:href="@{/diary/{id}(id=${e.id})}"><img class="post-image" loading="lazy" th:src="@{/diary/photos/{id}(id=${e.coverId})}" alt="日記の写真" style="width:100%;max-height:460px;object-fit:contain"></a><p class="ui-muted" th:text="${e.tags}"></p><a th:href="@{/diary/{id}(id=${e.id})}">続きを読む</a></div></article></div>
<nav class="ui-actions" aria-label="ページ切替"><a th:if="${diaryPage.page>1}" th:href="@{/diary(page=${diaryPage.page-1},tag=${tag})}" role="button" class="secondary">前へ</a><span th:text="${diaryPage.page + ' / ' + diaryPage.pages + 'ページ'}"></span><a th:if="${diaryPage.page<diaryPage.pages}" th:href="@{/diary(page=${diaryPage.page+1},tag=${tag})}" role="button" class="secondary">次へ</a></nav></div></body></html>

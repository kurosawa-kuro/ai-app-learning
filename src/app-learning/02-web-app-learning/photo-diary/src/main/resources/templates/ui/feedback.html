<div xmlns:th="http://www.thymeleaf.org" th:fragment="messages" th:remove="tag">
  <div class="ui-notice" role="status" th:if="${message}" th:text="${message}"></div>
  <div class="ui-notice ui-notice--error" role="alert" tabindex="-1" data-error-summary th:if="${error}">
    <strong>操作を完了できませんでした</strong><p th:text="${error}"></p>
    <ul th:if="${fieldErrors != null and !fieldErrors.isEmpty()}"><li th:each="entry : ${fieldErrors}">
      <a th:href="${'#' + entry.key}" th:text="${entry.value}"></a>
    </li></ul>
  </div>
</div>
<div xmlns:th="http://www.thymeleaf.org" th:fragment="empty(title, description, url, action)" class="ui-empty">
  <h2 th:text="${title}"></h2><p th:text="${description}"></p>
  <a role="button" class="secondary" th:href="${url}" th:text="${action}"></a>
</div>

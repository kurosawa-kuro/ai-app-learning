<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>タグ管理 | 写真日記</title></head><body>
<div id="heading"><h1>タグ管理</h1><p>ひとつの日記に複数のタグを。同じタグを、いくつもの日記に。</p></div><div id="actions"><a th:href="@{/diary}">日記一覧へ</a></div>
<div id="content" class="ui-stack"><p th:if="${error}" th:text="${error}" class="ui-notice ui-notice--error" role="alert"></p><p th:if="${success}" th:text="${success}" class="ui-notice" role="status"></p>
<article class="admin-card"><header><h2>タグを追加</h2></header><div class="admin-card__body"><form th:action="@{/admin/tags}" method="post"><input type="hidden" name="action" value="add"><label>新しいタグ名<input name="name" required maxlength="30" placeholder="例：お出かけ" th:value="${failedAction == 'add' ? inputName : ''}"></label><p class="ui-help">30文字まで。同じ名前やカンマは使えません。</p><button type="submit">タグを追加</button></form></div></article>
<p class="ui-help">名前の変更は、使用中の日記にも反映されます。日記で使用中のタグは削除できません。</p>
<article class="admin-card" th:each="t:${catalog}" data-tag-row><div class="admin-card__body"><form th:action="@{/admin/tags}" method="post" class="tag-editor"><input type="hidden" name="id" th:value="${t.id}"><input type="hidden" name="version" th:value="${t.version}"><label>タグ名<input name="name" required maxlength="30" th:value="${failedId == t.id ? inputName : t.name}"></label><p class="tag-meta" th:text="${t.uses + '件の日記で使用中'}"></p><div class="ui-actions"><button type="submit" name="action" value="rename" class="secondary">名前を保存</button><button type="submit" name="action" value="delete" class="secondary" th:disabled="${t.uses > 0}" th:attr="aria-label=${t.name + 'を削除'}">削除</button></div></form></div></article>
<p th:if="${#lists.isEmpty(catalog)}">タグはまだありません。最初のタグを追加してください。</p></div></body></html>

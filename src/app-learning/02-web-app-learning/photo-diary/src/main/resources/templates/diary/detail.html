<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title th:text="${entry.title + ' | 写真日記'}">日記</title></head><body><div id="heading"><h1 th:text="${entry.title}"></h1><p><time th:text="${#temporals.format(entry.entryDate,'yyyy/MM/dd')}"></time> · <span th:text="${entry.userName}"></span></p></div><div id="actions"><a th:href="@{/diary}">日記一覧へ</a></div><div id="content"><article class="admin-card"><div class="admin-card__body ui-stack"><p th:text="${entry.tags}" class="ui-muted"></p><p class="post-body" style="white-space:pre-wrap" th:text="${entry.body}"></p><figure th:each="p:${photos}"><div th:replace="~{diary/image :: image(${p.id},${entry.title},true)}"></div><figcaption>写真を押すと拡大できます。閉じると日記に戻ります。</figcaption></figure></div></article></div></body></html>

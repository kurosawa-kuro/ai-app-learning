<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}">
<head><title th:text="${entry.title + ' | 写真日記'}">日記</title></head><body><div id="heading"><h1 th:text="${entry.title}"></h1><p><time th:text="${entry.entryDate}"></time> · <span th:text="${entry.userName}"></span></p></div><div id="actions"><a th:href="@{/diary}">日記一覧へ</a></div><div id="content"><article class="admin-card"><div class="admin-card__body ui-stack"><p th:text="${entry.tags}" class="ui-muted"></p><p class="post-body" style="white-space:pre-wrap" th:text="${entry.body}"></p><figure th:each="p:${photos}"><a th:href="@{/diary/photos/{id}(id=${p.id})}" target="_blank" rel="noopener"><img class="post-image" th:src="@{/diary/photos/{id}(id=${p.id})}" alt="日記の写真" style="width:100%;max-height:650px;object-fit:contain"></a><figcaption>写真を押すと別タブで拡大できます。</figcaption></figure></div></article></div></body></html>

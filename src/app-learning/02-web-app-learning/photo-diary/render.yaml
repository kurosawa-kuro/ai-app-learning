# Render Blueprint. When creating it, set Blueprint Path to src/app-learning/02-web-app-learning/photo-diary/render.yaml.
# Docker paths are relative to rootDir.
services:
  - type: web
    name: learning-photo-diary
    runtime: docker
    plan: free
    region: singapore
    rootDir: src/app-learning/02-web-app-learning/photo-diary
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_AI_MODE
        value: demo
      - key: SUPABASE_STORAGE_BUCKET
        value: photo-diary-images-render
      - key: APP_DB_SCHEMA
        sync: false
      # Entered once in the Dashboard at Blueprint creation; never committed.
      - key: DB_HOST
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT
        value: 20s
      # To enable images, also add SUPABASE_URL and SUPABASE_SECRET_KEY in the Dashboard.
      - key: APP_IMAGES_ENABLED
        value: "false"

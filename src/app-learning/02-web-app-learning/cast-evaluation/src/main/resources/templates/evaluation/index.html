<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'standard', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>月次評価</title></head><body><div id="heading"><h1>月次評価</h1><p>単一店舗の実績を入力し、配点と集計結果の関係を確かめます。</p></div><div id="actions"></div><div id="content" class="ui-stack">
<form method="get" th:action="@{/evaluation}"><label>対象月<input type="month" name="month" th:value="${month}" required></label><button>表示する</button></form>
<article class="admin-card"><div class="admin-card__body"><h2>月次ランキング</h2><p>ポイント順、同点は売上順。両方同じ場合は同順位です。</p><div style="overflow-x:auto" tabindex="0" role="region" aria-label="月次ランキング。横にスクロールできます"><table style="min-width:42rem"><thead><tr><th>順位</th><th>名前</th><th>ポイント</th><th>個人売上</th><th>ドリンク</th><th>ボトル</th><th>指名</th><th>同伴</th></tr></thead><tbody><tr th:each="r:${results}"><td th:text="${r.rank}"></td><th th:text="${r.name}"></th><td th:text="${#numbers.formatDecimal(r.points,1,2)}"></td><td th:text="${r.sales}"></td><td th:text="${r.drinks}"></td><td th:text="${r.bottles}"></td><td th:text="${r.nominations}"></td><td th:text="${r.accompaniments}"></td></tr></tbody></table></div><p th:if="${#lists.isEmpty(members)}">最初にメンバーを登録してください。</p></div></article>
<article class="admin-card"><div class="admin-card__body"><h2>営業実績の入力・編集</h2><form th:action="@{/evaluation/record}" method="post" class="ui-stack" data-unsaved-form>
<input type="hidden" name="month" th:value="${month}"><input type="hidden" name="id" th:value="${input['id']}"><input type="hidden" name="version" th:value="${input['version'] ?: '0'}">
<label>メンバー<select name="memberId" required><option value="">選択してください</option><option th:each="m:${members}" th:if="${m.active or input['memberId']==m.id.toString()}" th:value="${m.id}" th:text="${m.name}" th:selected="${input['memberId']==m.id.toString()}"></option></select></label>
<label>営業日<input name="businessDate" type="date" th:value="${input['businessDate']}" required></label>
<label>ドリンク杯数<input type="number" name="drinks" min="0" max="1000000" step="1" th:value="${input['drinks'] ?: '0'}" required></label>
<label>ボトル本数<input type="number" name="bottles" min="0" max="1000000" step="1" th:value="${input['bottles'] ?: '0'}" required></label>
<label>指名件数<input type="number" name="nominations" min="0" max="1000000" step="1" th:value="${input['nominations'] ?: '0'}" required></label>
<label>同伴件数<input type="number" name="accompaniments" min="0" max="1000000" step="1" th:value="${input['accompaniments'] ?: '0'}" required></label>
<label>個人売上（円）<input type="number" name="sales" min="0" max="1000000000" step="1" th:value="${input['sales'] ?: '0'}" required></label>
<button>実績を保存</button><a th:href="@{/evaluation(month=${month})}">新規入力に戻す</a></form><h3>対象月の実績</h3><ul><li th:each="r:${records}"><a th:href="@{/evaluation(month=${month},edit=${r.id})}" th:text="${r.businessDate+' · '+r.name+'を編集'}"></a></li></ul></div></article>
<article class="admin-card"><div class="admin-card__body"><h2>メンバー管理</h2><form th:action="@{/evaluation/member}" method="post"><input type="hidden" name="month" th:value="${month}"><label>新しいメンバー名<input name="name" th:value="${failedOperation == 'member' and #strings.isEmpty(input['id']) ? input['name'] : ''}" maxlength="80" required></label><button>メンバーを追加</button></form>
<details th:each="m:${members}"><summary th:text="${m.name + (m.active ? '（在籍）' : '（退店）')}"></summary><form th:action="@{/evaluation/member}" method="post"><input type="hidden" name="month" th:value="${month}"><input type="hidden" name="id" th:value="${m.id}"><input type="hidden" name="version" th:value="${m.version}"><label>表示名<input name="name" th:value="${failedOperation == 'member' and input['id'] == m.id.toString() ? input['name'] : m.name}" maxlength="80" required></label><label><input type="checkbox" name="active" th:checked="${failedOperation == 'member' and input['id'] == m.id.toString() ? input.containsKey('active') : m.active}">在籍中</label><button>メンバーを保存</button></form></details><p>退店後も実績を残すため、削除せず在籍状態を変更します。</p></div></article>
<article class="admin-card"><div class="admin-card__body"><h2>評価ルール</h2><p>現在の配点で再計算します。変更すると過去月の結果も変わります。初期値は教材用の仮設定です。</p><details th:each="r:${rules}"><summary th:text="${r.category == 'DRINK' ? 'ドリンク' : r.category == 'BOTTLE' ? 'ボトル' : r.category == 'NOMINATION' ? '指名' : r.category == 'ACCOMPANIMENT' ? '同伴' : '個人売上'}"></summary><form th:action="@{/evaluation/rule}" method="post"><input type="hidden" name="month" th:value="${month}"><input type="hidden" name="category" th:value="${r.category}"><input type="hidden" name="version" th:value="${r.version}"><label>計算単位<input type="number" name="unit" min="0.01" step="0.01" th:value="${failedOperation == 'rule' and input['category'] == r.category ? input['unit'] : r.unit}" required></label><label>ポイント<input type="number" name="points" min="0" step="0.01" th:value="${failedOperation == 'rule' and input['category'] == r.category ? input['points'] : r.points}" required></label><label><input type="checkbox" name="enabled" th:checked="${failedOperation == 'rule' and input['category'] == r.category ? input.containsKey('enabled') : r.enabled}">この項目を評価に含める</label><button>ルールを保存</button></form></details></div></article>
</div></body></html>

<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>小さな学びのショップ</title></head><body><div id="heading"><h1>小さな学びのショップ</h1><p>架空の商品で、カートと注文の仕組みを体験します。決済・配送は行いません。</p></div><div id="actions"><a th:href="@{/shop}">商品一覧</a> · <a th:href="@{/shop/orders}">注文履歴</a></div><div id="content" class="ui-stack"><form th:action="@{/shop/confirm}" method="post" data-cart-form class="ui-stack"><label>注文する人<select name="user" required><option value="">選択してください</option><option th:each="u:${buyers}" th:value="${u.id}" th:text="${u.name}" th:selected="${cart['user'] != null ? cart['user']==u.id.toString() : currentAuthor != null and currentAuthor.id==u.id}"></option></select></label><p th:if="${#lists.isEmpty(buyers)}">先に<a th:href="@{/admin/users}">ユーザー管理</a>で名前を登録してください。</p><article class="admin-card" th:each="p:${products}"><div class="admin-card__body"><h2><a th:href="@{/shop/products/{id}(id=${p.id})}" th:text="${p.name}"></a></h2><p th:text="${p.description}"></p><p th:text="${p.price+'円'}"></p><label>数量<input type="number" min="0" max="99" step="1" th:name="${'qty.'+p.id}" th:value="${cart['qty.'+p.id] ?: '0'}" th:attr="data-price=${p.price}" required></label></div></article><p>カート合計：<strong id="cart-total">0</strong>円</p><button>注文内容を確認</button><p>カートはこの画面内だけの一時データです。</p></form></div></body></html>

<!doctype html>
<html lang="ja" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ログイン</title>
  <link rel="icon" th:href="@{/ui/favicon.svg}">
  <link rel="stylesheet" th:href="@{/vendor/pico/pico.min.css}">
  <link rel="stylesheet" th:href="@{/ui/ui.css}">
</head>
<body>
<main class="container" style="max-width: 28rem; padding-top: 12vh">
  <article>
    <header><h1>ログイン</h1></header>
    <p>管理者として登録されたGoogleアカウントでログインしてください。</p>
    <p th:if="${message}" th:attr="role=${failed ? 'alert' : 'status'}" th:text="${message}"></p>
    <a role="button" th:href="@{/auth/google}" style="width: 100%">Googleでログイン</a>
  </article>
</main>
</body>
</html>

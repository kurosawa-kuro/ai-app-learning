<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>注文の詳細</title></head><body><div id="heading"><h1>注文の詳細</h1><p>架空の商品で、カートと注文の仕組みを体験します。決済・配送は行いません。</p></div><div id="actions"><a th:href="@{/shop}">商品一覧</a> · <a th:href="@{/shop/orders}">注文履歴</a></div><div id="content" class="ui-stack"><article class="admin-card"><div class="admin-card__body"><p th:text="${order.name}"></p><ul><li th:each="l:${lines}"><span th:text="${l.productName}"></span> <span th:text="${l.unitPrice+'円 × '+l.quantity+'個 = '+l.total()+'円'}"></span></li></ul><p th:text="${'合計 '+order.total+'円'}"></p><p th:text="${order.cancelledAt==null?'注文済み':'取消済み'}"></p><form th:if="${order.cancelledAt==null}" th:action="@{/shop/orders/{id}/cancel(id=${order.id})}" method="post"><label><input type="checkbox" required>この注文全体を取り消すことを確認しました</label><button class="secondary">注文全体を取り消す</button></form></div></article></div></body></html>

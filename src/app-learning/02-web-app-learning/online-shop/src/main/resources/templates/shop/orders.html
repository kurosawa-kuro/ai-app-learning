<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>注文履歴</title></head><body><div id="heading"><h1>注文履歴</h1><p>架空の商品で、カートと注文の仕組みを体験します。決済・配送は行いません。</p></div><div id="actions"><a th:href="@{/shop}">商品一覧</a> · <a th:href="@{/shop/orders}">注文履歴</a></div><div id="content" class="ui-stack"><p>直近30件です。</p><p th:if="${#lists.isEmpty(orders)}">まだ注文はありません。</p><article class="admin-card" th:each="o:${orders}"><div class="admin-card__body"><a th:href="@{/shop/orders/{id}(id=${o.id})}" th:text="${o.name+' · '+o.createdLabel()}"></a><p th:text="${o.total+'円 · '+(o.cancelledAt==null?'注文済み':'取消済み')}"></p></div></article></div></body></html>

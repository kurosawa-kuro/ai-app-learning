<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, 'form', ~{::#heading}, ~{::#actions}, ~{::#content})}"><head><title>注文内容を確認</title></head><body><div id="heading"><h1>注文内容を確認</h1><p>架空の商品で、カートと注文の仕組みを体験します。決済・配送は行いません。</p></div><div id="actions"><a th:href="@{/shop}">商品一覧</a> · <a th:href="@{/shop/orders}">注文履歴</a></div><div id="content" class="ui-stack"><article class="admin-card"><div class="admin-card__body"><p th:text="${buyer.name+'さんの注文'}"></p><ul><li th:each="l:${lines}"><span th:text="${l.productName}"></span> <span th:text="${l.unitPrice+'円 × '+l.quantity+'個 = '+l.total()+'円'}"></span></li></ul><p th:text="${'合計 '+total+'円'}"></p><form th:action="@{/shop/orders}" method="post" data-order-form><input type="hidden" name="requestId" th:value="${requestId}"><input type="hidden" name="user" th:value="${buyer.id}"><th:block th:each="l:${lines}"><input type="hidden" th:name="${'qty.'+l.productId}" th:value="${l.quantity}"><input type="hidden" th:name="${'price.'+l.productId}" th:value="${l.unitPrice}"></th:block><p data-order-status role="status"></p><button>この内容で注文を確定</button></form><form th:action="@{/shop/cart}" method="post"><input type="hidden" name="user" th:value="${buyer.id}"><input th:each="l:${lines}" type="hidden" th:name="${'qty.'+l.productId}" th:value="${l.quantity}"><button class="secondary">数量を変更する</button></form></div></article></div></body></html>

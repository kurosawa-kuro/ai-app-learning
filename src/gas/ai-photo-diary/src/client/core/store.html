<script>
  // 画面どうしで共有する状態。書き換えるのはビュー（client/views/*）だけ。作成画面の入力中の状態は作成ビューの中に閉じる。
  App.store = {
    tags: CONFIG.tags, // タグマスター（起動時に受け取り、一覧の取得でも更新する）
    // 最初の一覧はサーバーが HTML に入れて渡す（CONFIG.initialList）。開いてから取りに行く往復をなくすため
    list: CONFIG.initialList
      ? { posts: CONFIG.initialList.posts, total: CONFIG.initialList.total, nextCursor: CONFIG.initialList.nextCursor || null, tag: null, loaded: true, loading: false, requestedTag: null, stale: false, error: null }
      : { posts: [], total: 0, nextCursor: null, tag: null, loaded: false, loading: false, requestedTag: undefined, stale: false, error: null },
    detailCache: new Map(), // 作成直後や一度開いた日記（詳細を取り直さずに出す）
    highlightId: null, // 保存した日記。一覧に戻ったときに一度だけ色を付ける

    /** 今の絞り込みのまま一覧へ戻るときの行き先。 */
    listRoute() {
      return { view: "list", tag: this.list.tag ? this.list.tag.id : null }
    },
  }
</script>
